{% extends "theme/base.html" %}
{% block content %}
<div class="container-xl">
  <div class="page-header d-print-none" aria-label="Page header">
    <div class="container-xl">
      <div class="row align-items-center">
        <div class="col">
          <div class="page-pretitle">Overview</div>
          <h2 class="page-title mb-0">{{ page_title|default:"New Mood Category" }}</h2>
        </div>
      </div>
    </div>
  </div>
  <br>

  <div class="card" style="max-width: 720px;">
    <div class="card-body">
      <form method="POST" action="{% if mood_category %}{% url 'mood_category:mood_category_update' mood_category.pk %}{% else %}{% url 'mood_category:mood_category_create' %}{% endif %}">
        {% csrf_token %}
        {% include 'theme/messages.html' %}

        <div class="mb-3">
          <label class="form-label required">Mood Category</label>
          <input type="text" name="name" id="id_name" class="form-control" placeholder="e.g. Happy, Sad, Anxious" value="{{ form_data.name }}" required>
          {% if errors.name %}
          <div class="text-danger small mt-1">{{ errors.name }}</div>
          {% endif %}
        </div>

        <div class="form-footer">
          <a href="{% url 'mood_category:mood_category_list' %}" class="btn btn-ghost-secondary">Cancel</a>
          <button type="submit" class="btn btn-primary">{{ submit_label|default:"Save Mood Category" }}</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
