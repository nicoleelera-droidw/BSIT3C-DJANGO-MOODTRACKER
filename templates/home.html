{% extends "theme/base.html" %}
{% load static %}

{% block content %}
<div class="container-xl">
  <div class="page-header d-print-none" aria-label="Page header">
    <div class="container-xl">
      <div class="row align-items-center">
        <div class="col">
          <div class="page-pretitle">Overview</div>
          <div class="d-flex align-items-center gap-3 flex-wrap d-none d-md-flex">
            <h2 class="page-title mb-0">Dashboard</h2>
          </div>
          <h2 class="page-title mb-0 d-md-none">Dashboard</h2>
        </div>
      </div>
    </div>
  </div>
  <br>

  <div class="row g-3 mb-3">
    <div class="col-6 col-xl-3">
      <div class="card">
        <div class="card-body">
          <div class="text-secondary">Total Users</div>
          <div class="h1 mb-0">{{ total_users }}</div>
        </div>
      </div>
    </div>
  </div>

  <div class="row g-3 mb-3">
    <div class="col-12">
      <div class="card">
        <div class="card-header">Moods</div>
        <div class="card-body">
          <div id="chart-moods"></div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'libs/apexcharts/dist/apexcharts.min.js' %}"></script>
<script>
  (function () {
    var attempts = 0;
    var maxAttempts = 60;

    function renderChart() {
      var el = document.getElementById("chart-moods");
      if (!el) { return; }
      
      if (typeof ApexCharts === 'undefined') {
        attempts++;
        if (attempts < maxAttempts) {
          setTimeout(renderChart, 100);
          return;
        }
        console.error('ApexCharts not loaded after waiting');
        el.innerHTML = '<div class="text-danger">Failed to load chart library.</div>';
        return;
      }

      var series = [{% for mood in moods %}{{ mood.value|default:0 }}{% if not forloop.last %},{% endif %}{% endfor %}];
      var labels = [{% for mood in moods %}"{{ mood.label|escapejs }}"{% if not forloop.last %},{% endif %}{% endfor %}];

      if (!series.length || series.every(function(v){ return v === 0; })) {
        el.innerHTML = '<div class="text-muted">No mood data available.</div>';
        return;
      }

      try {
        var chart = new ApexCharts(el, {
          chart: {
            type: "pie",
            height: 320,
          },
          labels: labels,
          series: series,
          title: {
            text: "Mood Distribution",
          },
          legend: {
            position: "bottom",
          },
          dataLabels: {
            enabled: true,
            formatter: function (val) {
              return val.toFixed(1) + "%";
            },
          },
          tooltip: {
            y: {
              formatter: function (val, opts) {
                var label = opts.w.globals.labels[opts.seriesIndex];
                return label + ": " + val;
              },
            },
          },
          plotOptions: {
            pie: {
              dataLabels: {
                offset: -10,
              },
            },
          },
        });

        chart.render();
      } catch (e) {
        console.error('Failed to render mood chart', e);
        el.innerHTML = '<div class="text-danger">Error rendering chart.</div>';
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', renderChart);
    } else {
      renderChart();
    }
  })();
</script>
{% endblock %}
